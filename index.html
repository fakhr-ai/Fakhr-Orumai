<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#009688">
<title>دستیار فخر اروم</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#202832;--muted:#77808c;--line:#e5e9ef;--accent:#009688;--bubble:#edf7f5}
[data-theme="dark"]{--bg:#111820;--panel:#1b2530;--text:#edf2f7;--muted:#a4b0bd;--line:#303d49;--bubble:#243d3b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100dvh}
button,textarea,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100dvh;max-width:1500px;margin:auto}
.sidebar{width:270px;background:var(--panel);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.brand{text-align:center;padding:14px 5px}
.logo{width:58px;height:58px;border-radius:18px;background:var(--accent);color:white;display:grid;place-items:center;font-size:30px;margin:0 auto 10px}
.brand h2{font-size:17px;margin:8px 0}
.brand p{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px;border-radius:12px}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.history-title{font-size:12px;color:var(--muted);margin:10px 0}
#history{overflow:auto}
.history-item{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:10px;padding:10px;background:transparent;color:var(--text);text-align:right;font-size:13px;margin-bottom:4px}
.history-item.active,.history-item:hover{background:var(--bubble)}
.del{border:0;background:transparent;color:var(--muted);font-size:18px}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar h3{font-size:15px;margin:0}
.top-actions{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}
.status{font-size:11px;color:var(--muted)}
#messages{flex:1;overflow:auto;padding:24px 16px 12px}
.welcome{max-width:650px;margin:7vh auto 20px;text-align:center}
.welcome .logo{width:72px;height:72px;font-size:36px}
.welcome h2{font-size:23px}
.welcome p{line-height:2;color:var(--muted);font-size:14px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.suggestion{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:13px}
.suggestion:hover{border-color:var(--accent)}
.message{display:flex;gap:10px;max-width:800px;margin:0 auto 18px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;flex-shrink:0;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center}
.bubble{max-width:85%;padding:13px 15px;border-radius:15px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:14px}
.user .bubble{background:var(--bubble)}
.error{color:#d84a4a}
.composer-wrap{padding:12px 16px 18px}
.composer{max-width:820px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}
#prompt{resize:none;flex:1;min-width:0;max-height:150px;border:0;outline:none;background:transparent;color:var(--text);padding:8px;line-height:1.8}
#sendBtn{width:43px;height:43px;border:0;border-radius:13px;background:var(--accent);color:white;font-size:21px}
#sendBtn:disabled{opacity:.5}
.hint{text-align:center;color:var(--muted);font-size:10px;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal.open{display:flex}
.modal-card{width:min(460px,100%);max-height:90dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:20px}
.modal-card h3{margin-top:0}
.field{display:grid;gap:7px;margin:15px 0;font-size:13px}
.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions button{flex:1}
#settingsStatus{font-size:12px;color:var(--accent)}
@media(max-width:700px){
.sidebar{width:64px;padding:8px;align-items:center}
.sidebar .brand{padding:8px 0}
.sidebar .brand .logo{width:43px;height:43px;font-size:22px;margin:0 auto}
.sidebar .brand h2,.sidebar .brand p,.sidebar .sidebar-label,.sidebar .history-title,#history,.sidebar-bottom .btn span{display:none}
.sidebar .btn{width:46px;height:46px;padding:5px;font-size:20px}
.sidebar-bottom{width:100%;gap:7px}
.topbar{padding:0 12px}
.status{display:none}
#messages{padding:18px 10px}
.welcome{margin-top:5vh}
.suggestions{grid-template-columns:1fr}
.composer-wrap{padding:8px 9px 12px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="logo">✦</div>
    <h2>دستیار فخر اروم</h2>
    <p>همراه هوشمند آموزشی</p>
  </div>
  <button class="btn primary" id="newChat">＋ <span>گفت‌وگوی جدید</span></button>
  <div class="sidebar-label history-title">تاریخچه گفتگوها</div>
  <div id="history"></div>
  <div class="sidebar-bottom">
    <button class="btn" id="settingsBtn">⚙️ <span>تنظیمات</span></button>
    <button class="btn" id="clearHistory">🗑️ <span>پاک‌کردن تاریخچه</span></button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <h3 id="chatTitle">گفت‌وگوی تازه</h3>
    <div class="top-actions">
      <span class="status" id="connectionStatus">سرور واسط</span>
      <button class="iconbtn" id="themeBtn" title="تغییر پوسته">🌙</button>
    </div>
  </header>

  <section id="messages"></section>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="پیامت رو اینجا بنویس..." aria-label="پیام"></textarea>
      <button id="sendBtn" title="ارسال پیام">➤</button>
    </div>
    <div class="hint">دستیار فخر اروم ممکن است اشتباه کند؛ پاسخ‌های مهم را بررسی کن.</div>
  </div>
</main>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-card">
    <h3>⚙️ تنظیمات دستیار</h3>
    <div class="field">
      <label for="proxyUrl">آدرس Cloudflare Worker</label>
      <input id="proxyUrl" type="url" value="https://fakhr-ai.samyarkhakpwr04.workers.dev">
    </div>
    <div class="field">
      <label for="apiModel">مدل هوش مصنوعی</label>
      <input id="apiModel" value="@cf/zai-org/glm-4.7-flash" readonly>
    </div>
    <p style="font-size:12px;line-height:1.9;color:var(--muted)">کلید محرمانه را داخل HTML عمومی قرار نده. اتصال هوش مصنوعی از طریق Worker انجام می‌شود.</p>
    <div id="settingsStatus"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelSettings">بستن</button>
      <button class="btn primary" id="saveSettings">ذخیره تنظیمات</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const STORAGE = "fakhr-urom-chat-v1";
let conversations = [];
let currentId = null;
let busy = false;
let config = {
  proxy: "https://fakhr-ai.samyarkhakpwr04.workers.dev"
};

const welcomeHTML = `
<div class="welcome">
  <div class="logo">✦</div>
  <h2>سلام! 👋</h2>
  <p>من دستیار فخر اروم هستم. می‌تونم در درس‌ها، نوشتن متن، حل مسئله و ایده‌پردازی کمکت کنم. از کجا شروع کنیم؟</p>
  <div class="suggestions">
    <button class="suggestion">📘 یک مفهوم درسی را توضیح بده</button>
    <button class="suggestion">📝 برایم نمونه سؤال بساز</button>
    <button class="suggestion">🧠 در حل یک مسئله کمکم کن</button>
    <button class="suggestion">✍️ یک متن بنویس</button>
  </div>
</div>`;

function persist() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify({
      conversations, currentId, config
    }));
  } catch (e) {
    console.warn("ذخیره‌سازی ممکن نشد", e);
  }
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE) || "{}");
    conversations = Array.isArray(saved.conversations) ? saved.conversations : [];
    currentId = saved.currentId || null;
    config = { ...config, ...(saved.config || {}) };
  } catch (e) {}

  let theme = "light";
  try { theme = localStorage.getItem("fakhr-theme") || "light"; } catch(e) {}
  document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";

  if (!conversations.some(c => c.id === currentId)) currentId = null;
  if (!currentId) newConversation(false);
  renderAll();
  $("proxyUrl").value = config.proxy;
  updateStatus();
}

function current() {
  return conversations.find(c => c.id === currentId);
}

function newConversation(save = true) {
  const c = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title: "گفت‌وگوی تازه",
    messages: [],
    updated: Date.now()
  };
  conversations.unshift(c);
  currentId = c.id;
  if (save) persist();
  renderAll();
}

function renderAll() {
  renderHistory();
  renderChat();
}

function renderHistory() {
  const el = $("history");
  el.replaceChildren();

  [...conversations]
    .sort((a,b) => b.updated - a.updated)
    .forEach(c => {
      const button = document.createElement("button");
      button.className = "history-item" + (c.id === currentId ? " active" : "");

      const title = document.createElement("span");
      title.textContent = c.title || "گفت‌وگوی تازه";

      const del = document.createElement("span");
      del.className = "del";
      del.textContent = "×";
      del.title = "حذف گفتگو";
      del.onclick = e => {
        e.stopPropagation();
        deleteConversation(c.id);
      };

      button.append(title, del);
      button.onclick = () => {
        currentId = c.id;
        persist();
        renderAll();
      };
      el.append(button);
    });
}

function renderChat() {
  const c = current();
  $("chatTitle").textContent = c?.title || "گفت‌وگوی تازه";
  const box = $("messages");
  box.replaceChildren();

  if (!c || !c.messages.length) {
    box.innerHTML = welcomeHTML;
    box.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => {
        $("prompt").value = button.textContent.replace(/^[^ ]+\s*/, "");
        sendMessage();
      });
    });
    return;
  }

  c.messages.forEach(m => addMessageNode(m.role, m.content, false));
  box.scrollTop = box.scrollHeight;
}

function addMessageNode(role, content, scroll = true) {
  const box = $("messages");
  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "ش" : "✦";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;

  row.append(avatar, bubble);
  box.append(row);
  if (scroll) box.scrollTop = box.scrollHeight;
  return row;
}

function updateStatus() {
  $("connectionStatus").textContent = "اتصال Cloudflare Worker";
}

function deleteConversation(id) {
  conversations = conversations.filter(c => c.id !== id);
  if (currentId === id) currentId = conversations[0]?.id || null;
  if (!currentId) newConversation(false);
  persist();
  renderAll();
}

function clearHistory() {
  if (!confirm("همه گفتگوهای ذخیره‌شده پاک شوند؟")) return;
  conversations = [];
  currentId = null;
  newConversation(false);
  persist();
  renderAll();
}

function setBusy(value) {
  busy = value;
  $("sendBtn").disabled = value;
  $("prompt").disabled = value;
  $("sendBtn").textContent = value ? "…" : "➤";
}

async function sendMessage() {
  if (busy) return;

  const input = $("prompt");
  const text = input.value.trim();
  if (!text) return;

  let c = current();
  if (!c) {
    newConversation(false);
    c = current();
  }

  c.messages.push({ role: "user", content: text });
  if (c.messages.filter(m => m.role === "user").length === 1) {
    c.title = text.length > 34 ? text.slice(0,34) + "…" : text;
  }

  c.updated = Date.now();
  input.value = "";
  input.style.height = "auto";
  persist();
  renderAll();

  const pending = addMessageNode("assistant", "در حال دریافت پاسخ…");
  setBusy(true);

  try {
    const answer = await getAnswer(c.messages);
    pending.remove();
    c.messages.push({ role: "assistant", content: answer });
  } catch (error) {
    pending.remove();
    c.messages.push({
      role: "assistant",
      content: "خطا در دریافت پاسخ: " + (error?.message || "اتصال برقرار نشد")
    });
  } finally {
    c.updated = Date.now();
    persist();
    renderAll();
    setBusy(false);
    input.focus();
  }
}

async function getAnswer(messages) {
  const endpoint = config.proxy.trim();
  if (!endpoint) throw new Error("آدرس Worker را در تنظیمات وارد کن.");

  const response = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      messages: messages.map(m => ({
        role: m.role,
        content: m.content
      }))
    })
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.details || data.error || ("خطای سرور " + response.status)
    );
  }

  const answer = data.answer || data.content || data.message;
  if (typeof answer !== "string" || !answer.trim()) {
    throw new Error("پاسخ متنی از سرور دریافت نشد.");
  }

  return answer.trim();
}

$("newChat").onclick = () => newConversation();
$("clearHistory").onclick = clearHistory;
$("sendBtn").onclick = sendMessage;

$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("prompt").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 150) + "px";
});

$("themeBtn").onclick = () => {
  const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  try { localStorage.setItem("fakhr-theme", theme); } catch(e) {}
};

$("settingsBtn").onclick = () => {
  $("proxyUrl").value = config.proxy;
  $("settingsStatus").textContent = "";
  $("settingsModal").classList.add("open");
};

function closeSettings() {
  $("settingsModal").classList.remove("open");
}

$("cancelSettings").onclick = closeSettings;

$("saveSettings").onclick = () => {
  const url = $("proxyUrl").value.trim();
  if (!url.startsWith("https://")) {
    $("settingsStatus").textContent = "آدرس باید با https:// شروع شود.";
    return;
  }
  config.proxy = url;
  persist();
  updateStatus();
  $("settingsStatus").textContent = "تنظیمات ذخیره شد.";
  setTimeout(closeSettings, 500);
};

$("settingsModal").addEventListener("click", e => {
  if (e.target === $("settingsModal")) closeSettings();
});

window.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSettings();
});

load();
})();
</script>
</body>
</html>
